name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CI: "true"

jobs:
  backend:
    name: Backend (build, arquitectura, unitarias, integración)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Backend.sln

      - name: Build Release
        run: dotnet build src/Backend.sln -c Release --no-restore

      - name: Pruebas de arquitectura
        run: >
          dotnet test tests/Backend.ArchitectureTests/Backend.ArchitectureTests.csproj
          -c Release --no-build --logger "trx;LogFileName=arquitectura.trx"
          --results-directory TestResults

      - name: Pruebas unitarias
        run: >
          dotnet test tests/Backend.UnitTests/Backend.UnitTests.csproj
          -c Release --no-build --logger "trx;LogFileName=unitarias.trx"
          --results-directory TestResults

      - name: Pruebas de integración (Testcontainers)
        run: >
          dotnet test tests/Backend.IntegrationTests/Backend.IntegrationTests.csproj
          -c Release --no-build --logger "trx;LogFileName=integracion.trx"
          --results-directory TestResults

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: TestResults/*.trx
          if-no-files-found: warn

  frontend:
    name: SPA (build y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Pruebas unitarias de la SPA
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test

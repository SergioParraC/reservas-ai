name: reservas-espacios

# Entorno público: mssql NO publica puertos, la API solo es alcanzable por Caddy
# y Caddy termina TLS. Uso: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reservas-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD en .env.prod}"
    volumes:
      - mssql-datos:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - interna

  api:
    image: "${IMAGEN_API:?define IMAGEN_API en .env.prod}"
    container_name: reservas-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # TLS lo termina Caddy: la API no debe redirigir a HTTPS por sí misma.
      Https__Redirigir: "false"
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=${BD_NOMBRE:-ReservasEspaciosDb};User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Issuer: "https://${DOMINIO}"
      Jwt__Audience: "${JWT_AUDIENCE:-reservas-espacios-spa}"
      Jwt__ExpiraMinutos: "${JWT_EXPIRA_MINUTOS:-60}"
      Jwt__Key: "${JWT_KEY:?define JWT_KEY en .env.prod}"
      EntraId__TenantId: "${ENTRA_TENANT_ID:-}"
      EntraId__ClientId: "${ENTRA_CLIENT_ID:-}"
      EntraId__Audience: "${ENTRA_AUDIENCE:-}"
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:?define SEED_ADMIN_EMAIL en .env.prod}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:?define SEED_ADMIN_PASSWORD en .env.prod}"
      Seed__AdminNombre: "${SEED_ADMIN_NOMBRE:-Administrador del Sistema}"
      Identidad__DominioCorreoInstitucional: "${DOMINIO_CORREO_INSTITUCIONAL:-uninpahu.edu.co}"
      # Fotografías del catálogo: volumen persistente, servido bajo /media.
      Almacen__RutaBase: "/var/lib/reservas"
      Cors__OrigenesPermitidos__0: "https://${DOMINIO}"
      Solicitudes__TamanoMaximoPdfBytes: "${TAMANO_MAXIMO_PDF_BYTES:-5242880}"
      Solicitudes__MaxSolicitudesActivasPorUsuario: "${MAX_SOLICITUDES_ACTIVAS:-3}"
      Solicitudes__LongitudMinimaMotivoRechazo: "10"
      Semestre__SemanasMaximasPorSerie: "${SEMANAS_MAXIMAS_POR_SERIE:-20}"
      Semestre__AntelacionMinimaDias: "${ANTELACION_MINIMA_DIAS:-3}"
      Calendario__MinutosCacheCalendario: "1"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Puerto: "${SMTP_PUERTO:-587}"
      Smtp__UsarSsl: "${SMTP_USAR_SSL:-false}"
      Smtp__Usuario: "${SMTP_USUARIO:-}"
      Smtp__Contrasena: "${SMTP_CONTRASENA:-}"
      Smtp__RemitenteCorreo: "${SMTP_REMITENTE_CORREO:-reservas@reservas-espacios.local}"
      Smtp__RemitenteNombre: "${SMTP_REMITENTE_NOMBRE:-Reservas de Espacios}"
      Smtp__Habilitado: "${SMTP_HABILITADO:-false}"
      Smtp__IntervaloDespachoSegundos: "${SMTP_INTERVALO_SEGUNDOS:-30}"
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - medios:/var/lib/reservas
    networks:
      - interna
      - proxy

  caddy:
    image: caddy:2-alpine
    container_name: reservas-caddy
    environment:
      DOMINIO: "${DOMINIO}"
      CORREO_TLS: "${CORREO_TLS}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv:ro
      - caddy-datos:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - proxy

volumes:
  mssql-datos:
  medios:
  caddy-datos:
  caddy-config:

networks:
  interna:
    internal: true
  proxy:
